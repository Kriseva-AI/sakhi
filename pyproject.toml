[project]
name = "kriseva-sakhi"
version = "0.1.0"
description = "Source-backed local support navigator. Internal preview, no institutional integrations."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.135,<1", "uvicorn>=0.41,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]
embeddings = [
    "sentence-transformers>=6.1,<7",
    "transformers>=5.0,<6",
    "torch>=2.10,<3",
    "pillow>=12,<13",
    "torchvision>=0.25,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Protected review only. Authentication and release approval are hosting gates.
[tool.vercel]
entrypoint = "services.api.main:app"

[tool.vercel.fastapi.static]
cdn = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
