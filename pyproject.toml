[project]
name = "kriseva-sakhi"
version = "0.1.0"
description = "Source-backed local support navigator. Internal preview, no institutional integrations."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.135,<1", "uvicorn>=0.41,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]
embeddings = ["sentence-transformers>=5.3,<6", "transformers>=5.0,<6", "torch>=2.10,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
